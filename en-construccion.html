<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102b20" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Mapale — Sitio en construcción</title>
    <link rel="icon" href="assets/mapale-mark.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Manrope:wght@400;500;600&amp;family=Syne:wght@600;700&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="construction.css" />
  </head>
  <body>
    <main class="construction-page">
      <div class="construction-page__rings" aria-hidden="true"></div>
      <section class="construction-card">
        <div class="construction-card__identity" aria-label="Mapale, desarrolladora y constructora">
          <img class="construction-card__mark" src="assets/mapale-mark-transparent.png" alt="" />
          <img class="construction-card__logo" src="assets/mapale-wordmark-transparent.png" alt="" />
        </div>
        <p class="construction-card__eyebrow"><i class="fa-solid fa-helmet-safety" aria-hidden="true"></i> SITIO EN CONSTRUCCIÓN</p>
        <h1>Estamos preparando<br /><em>algo nuevo.</em></h1>
        <p class="construction-card__copy">Muy pronto vas a poder conocer nuestros desarrollos y proyectos.</p>
        <span class="construction-card__line" aria-hidden="true"></span>
        <p class="construction-card__brand">MAPALE · DESARROLLADORA Y CONSTRUCTORA</p>
      </section>
    </main>
  </body>
</html>
